<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400&display=swap');
:root{--mx:50vw;--my:50vh;--ink:#e9e4d9;--font:'Space Mono',ui-monospace,monospace}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:var(--font);color:var(--ink)}[hidden]{display:none!important}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #d1bca0;outline-offset:5px}#air{position:fixed;inset:0;z-index:1;touch-action:none}#darkness{position:fixed;inset:0;z-index:4;background:#000000;pointer-events:none;transition:background 1.4s,opacity 1.5s}body[data-phase=appear] #darkness,body[data-phase=waking] #darkness,body[data-phase=name] #darkness,body[data-phase=greeting] #darkness{background:#000000}body[data-phase=search] #darkness{background:#000000;transition:none}body[data-phase=lit] #darkness{opacity:0}#wake{position:fixed;z-index:8;left:50%;top:51%;transform:translate(-50%,-50%);padding:15px 34px;min-height:48px;background:transparent;border:1px solid #c9c5b57a;border-radius:2px;color:#e9e4d9;font:13px var(--font);letter-spacing:.4px;opacity:0;transition:opacity 1s,background .3s;pointer-events:none}#wake.ready{opacity:1;pointer-events:auto}#wake:hover{background:#ddd4b710}#name-form{position:fixed;z-index:8;left:50%;bottom:max(8vh,76px);transform:translateX(-50%);width:min(360px,calc(100% - 44px));animation:arrive .8s both}label{display:block;text-align:center;font:20px/1.5 var(--font);margin-bottom:20px}.name-row{display:flex;border-bottom:1px solid #e9e4d970;gap:12px;padding-bottom:8px}input{min-width:0;flex:1;background:transparent;border:0;color:#e9e4d9;padding:12px 4px;font-size:16px;border-radius:0}input::placeholder{color:#a7a4a0}#name-form button{background:transparent;border:0;color:#d6c6af;padding:10px;min-height:44px;font-size:12px;white-space:nowrap}#dialogue{position:fixed;z-index:7;left:50%;bottom:max(8vh,80px);transform:translateX(-50%);width:min(440px,calc(100% - 48px));margin:0;text-align:center;color:#e9e4d9;font:clamp(16px,1.7vw,18px)/1.65 var(--font);white-space:pre-line;text-wrap:balance;pointer-events:none;text-shadow:0 2px 16px #0008}body[data-phase=lit] #dialogue{color:#e9e4d9;text-shadow:0 2px 16px #000;transition:color 1s}#spark{position:fixed;z-index:5;left:var(--mx);top:var(--my);width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,239,201,.23),rgba(255,239,201,.10) 32%,rgba(255,239,201,.025) 54%,transparent 72%);transform:translate(-50%,-50%);pointer-events:none}#spark:after{content:"";position:absolute;left:128px;top:128px;width:4px;height:4px;border-radius:50%;background:#fff6d4;box-shadow:0 0 18px 5px #fce6ad80}#objective{position:fixed;z-index:7;left:24px;top:max(24px,env(safe-area-inset-top));margin:0;color:#e9e4d9;font-size:13px;line-height:1.7;letter-spacing:.2px;pointer-events:none;animation:arrive 1s both}#objective span{display:block;margin-bottom:3px;color:#999892;font-size:9px;letter-spacing:1.5px}#error{position:fixed;z-index:9;inset:0;background:#000000;display:grid;place-content:center;text-align:center;color:#c9c2b6;font:16px/1.6 var(--font);padding:35px}#error button{background:transparent;border:1px solid #777;color:inherit;padding:12px;margin-top:15px}body[data-phase=search]{cursor:none}body[data-phase=search] button{cursor:none}@keyframes arrive{from{opacity:0}to{opacity:1}}@media(max-width:600px){#name-form{bottom:80px}#dialogue{bottom:82px;font-size:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

#seed,#soil,#pet,#five{position:fixed;z-index:6;padding:0;touch-action:none;background:none;border:0;transform:translate(-50%,-50%)}
#seed{left:19%;top:72%;width:56px;height:56px;opacity:.12;transition:opacity .3s}
#seed:after{content:'';position:absolute;left:27px;top:27px;width:2px;height:2px;background:#f7e8bb;border-radius:50%;box-shadow:0 0 8px #e7d4a2}
#seed:focus-visible{opacity:1!important}
body[data-carrying=true] #seed:after{display:none}
body[data-carrying=true] #seed{opacity:1!important;pointer-events:none}
#soil{width:74px;height:54px;border-radius:50%;border:1px dashed #d8cba168;box-shadow:0 0 28px #e2c88a15;color:#d8cba1;transition:border-color .5s,box-shadow .5s}
#soil.warming{border-style:solid;border-color:#e6d7a3;box-shadow:0 0 36px #e8cb7940}
#soil.grown{border-color:transparent;box-shadow:none;pointer-events:none}
#pet{width:110px;height:100px;border-radius:20px}
#five{width:56px;height:64px;border-radius:50%}
#pet:focus-visible,#five:focus-visible{outline:1px dashed #d8cba1;background:#fff3cc08}
#choice{position:fixed;z-index:8;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#0008;border:1px solid #d8cba16b;border-radius:2px;color:var(--ink);font:11px var(--font);letter-spacing:.3px;padding:13px 23px;min-height:44px;animation:arrive 1s both}
#choice:hover{background:#e8d8ac15}
#growth{position:fixed;z-index:7;width:140px;transform:translate(-50%,-50%);height:2px;background:#d8cba126;pointer-events:none}
#growth i{display:block;background:#d8d99a;height:100%;width:0;box-shadow:0 0 8px #e1d79c50}
@media(max-width:600px){#seed{left:16%;top:68%}#objective{left:20px;top:22px;font-size:11px}#pet{width:86px;height:86px}}

body[data-chapter=planting] #dialogue,body[data-chapter=growing] #dialogue{top:12vh;bottom:auto}
.arm-handle,#turn-milo,#back-name,#moth-guide{position:fixed;z-index:6;background:transparent;border:0;padding:0;transform:translate(-50%,-50%);touch-action:none}

#turn-milo{width:260px;height:420px;cursor:grab;border-radius:35%}
#back-name{z-index:8;width:100px;height:56px;cursor:pointer;border-radius:3px}
#back-name:hover,#back-name:focus-visible{box-shadow:0 0 22px #f4e6ba2b;outline:1px solid #e8ddbb80}
#answers{position:fixed;z-index:9;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:12px;width:max-content;max-width:calc(100% - 32px)}
#answers button{min-height:44px;padding:12px 18px;background:#000b;border:1px solid #d8cba16b;border-radius:2px;color:var(--ink);font:11px var(--font)}
#answers button:hover{background:#d8cba118}
#nickname-form{position:fixed;z-index:9;left:50%;bottom:max(12vh,90px);transform:translateX(-50%);width:min(360px,calc(100% - 44px))}
#nickname-form button{background:transparent;border:0;color:#d6c6af;padding:10px;font-size:12px;min-height:44px;white-space:nowrap}
#moth-guide{width:76px;height:76px;border-radius:50%;z-index:7;cursor:pointer}
#moth-guide:focus-visible{outline:1px dashed #e2d2a6}
body[data-chapter=name-search] #dialogue{top:11vh;bottom:auto}
body[data-arm-dragging=true]{cursor:grabbing;user-select:none;-webkit-user-select:none}
@media(max-width:600px){#turn-milo{width:240px;height:470px}#back-name{width:110px;height:58px}#answers{gap:8px}#answers button{padding:11px 13px;font-size:10px}#nickname-form label{font-size:17px}}

#water-can,#water-hand{position:fixed;z-index:8;transform:translate(-50%,-50%);width:76px;height:68px;padding:0;background:transparent;border:0;border-radius:18px;touch-action:none;cursor:grab}
#water-can:active{cursor:grabbing}
#water-can,#water-can:hover,#water-can:focus-visible,#water-hand,#water-hand:focus-visible{outline:none;box-shadow:none;background:transparent}
#water-hand{width:62px;height:62px;border:0;border-radius:50%;cursor:pointer}
body[data-chapter^=water-] #dialogue{top:max(10vh,65px);bottom:auto}

#collect-cap,#collect-hand,#collect-box,#collect-place{position:fixed;z-index:8;transform:translate(-50%,-50%);padding:0;touch-action:none;background:transparent;border:0;border-radius:8px;min-width:48px;min-height:48px}
#collect-cap{cursor:grab;width:54px;height:54px}
#collect-box{cursor:grab;width:80px;height:68px}
#collect-cap:active,#collect-box:active{cursor:grabbing}
#collect-hand,#collect-place{width:70px;height:60px;border:1px dashed #d8cba170;box-shadow:0 0 24px #d8cba118;cursor:pointer;border-radius:50%}
#collect-cap:focus-visible,#collect-box:focus-visible{outline:1px dashed #b6c9df}
body[data-chapter^=collection-] #dialogue{top:max(11vh,70px);bottom:auto}
@media(max-width:600px){body[data-chapter^=collection-] #dialogue{top:12vh}}

#hanging-light{position:fixed;z-index:5;left:82%;top:0;width:140px;height:310px;transform:translateX(-50%);pointer-events:none;opacity:0;--pull:0px}
#switch{position:absolute;left:104px;top:0;width:44px;height:291px;padding:0;transform:translateX(-50%);border:0;border-radius:0;background:transparent;box-shadow:none;opacity:1;touch-action:none;pointer-events:auto;cursor:grab}
#switch:before,#switch:after{content:none}
#switch span{position:absolute;left:21px;top:0;width:2px;height:calc(241px + var(--pull));border:0;border-radius:0;background:repeating-linear-gradient(#b5a388 0 3px,#70675b 3px 5px);box-shadow:none;transition:height .25s ease-out}
#switch span:after{content:'';position:absolute;left:-5px;bottom:-14px;width:12px;height:19px;border-radius:6px;background:linear-gradient(90deg,#8a7460,#d3b495 48%,#9d8168);box-shadow:inset 0 -2px 2px #0005}
#switch:active{cursor:grabbing}
#hanging-light[data-pulling=true] #switch span{transition:none}
#switch[aria-pressed=true] span{transform:none}
#switch:disabled{cursor:default;pointer-events:none}
body[data-phase=lit] #hanging-light{opacity:1!important;mask-image:none!important}
@media(max-width:600px){#hanging-light{left:80%;transform:translateX(-50%) scale(.78);transform-origin:top center}#switch{left:104px;top:0;width:44px;height:291px}}

#shelf-find,#shelf-clean,#shelf-book{position:fixed;z-index:8;padding:0;border:0;background:transparent;transform:translate(-50%,-50%);touch-action:none}
#shelf-find{width:130px;height:160px;cursor:pointer}
#shelf-clean{cursor:grab;border-radius:4px}
body[data-chapter=shelf-cleaning] #shelf-clean{cursor:crosshair}
body[data-shelf-wiping=true]{user-select:none;-webkit-user-select:none}
#shelf-book{width:64px;height:34px;cursor:pointer}
#shelf-clean:active{cursor:grabbing}
body[data-chapter=shelf-cleaning] #shelf-clean:active{cursor:crosshair}
#shelf-find:focus-visible,#shelf-clean:focus-visible:focus-visible,#shelf-book:focus-visible{outline:1px solid #c3aa7580;outline-offset:4px}
body[data-chapter^=shelf-] #dialogue{top:max(11vh,70px);bottom:auto}

#preview-menu{position:fixed;z-index:30;inset:0;display:grid;place-content:center;background:#090b0ff2;padding:24px;overflow:auto;cursor:auto}
#preview-menu h2{font:16px var(--font);margin:0 0 12px}
#preview-menu p{font:11px/1.7 var(--font);color:#a4a5a7;max-width:400px;margin:0 0 18px}
#preview-stops{display:grid;grid-template-columns:repeat(2,minmax(0,190px));gap:8px}
#preview-menu button{font:12px var(--font);min-height:44px;border:1px solid #555b62;border-radius:3px;background:#20252b;color:var(--ink);padding:10px 14px;text-align:left;cursor:pointer}
#preview-menu button:hover{background:#343c44}
#preview-actions{display:flex;gap:8px;margin-top:18px}
#preview-status{margin-top:12px!important}
body[data-room-preview=true] #pet,body[data-room-preview=true] .arm-handle,body[data-room-preview=true] #collect-cap,body[data-room-preview=true] #shelf-book{display:none;pointer-events:none}

</style></head><body data-phase="boot">
<div id="air" aria-hidden="true"></div><div id="hanging-light" aria-hidden="false" hidden>
<button id="switch" type="button" aria-label="Pull the hanging light cord" aria-pressed="false" hidden><span></span></button>
</div><div id="darkness"></div><div id="spark" hidden></div><button id="wake" type="button" disabled>Wake up</button>
<button id="seed" type="button" aria-label="Pick up the glimmering seed" hidden></button>
<button id="soil" type="button" aria-label="Plant the seed beside Milo" hidden></button>
<button id="pet" type="button" aria-label="Pat Milo’s head" hidden></button>

<button id="choice" type="button" hidden></button>
<div id="growth" role="progressbar" aria-label="Plant growth" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i></i></div>
<button id="arm-left" class="arm-handle" type="button" aria-label="Move Milo’s left arm" hidden></button>
<button id="arm-right" class="arm-handle" type="button" aria-label="Move Milo’s right arm" hidden></button>
<button id="turn-milo" type="button" aria-label="Turn Milo to find his name. Use the left and right arrow keys." hidden></button>
<button id="back-name" type="button" aria-label="Read the name on his back" hidden></button>
<div id="answers" role="group" aria-label="Your answer" hidden></div>
<form id="nickname-form" hidden><label for="robot-name">What should I be called?</label><div class="name-row"><input id="robot-name" aria-label="Robot’s new name" placeholder="A name for him" maxlength="20" autocomplete="off" required><button type="submit">That’s you</button></div></form>
<button id="water-can" type="button" aria-label="Pick up the watering can" hidden></button>
<button id="water-hand" type="button" aria-label="Place the watering can in his right hand" hidden></button>
<button id="collect-cap" type="button" aria-label="Pick up the blue bottle cap" hidden></button>
<button id="collect-hand" type="button" aria-label="Give the bottle cap to Milo" hidden></button>
<button id="collect-box" type="button" aria-label="Pick up the little keepsake box" hidden></button>
<button id="collect-place" type="button" aria-label="Place the keepsake box beside Milo" hidden></button>
<button id="shelf-find" type="button" aria-label="Look at the little shelf" hidden></button>
<button id="shelf-clean" type="button" aria-label="Clean the dusty shelf" hidden></button>
<button id="shelf-book" type="button" aria-label="Look at the book on the shelf" hidden></button>
<button id="moth-guide" type="button" aria-label="Keep your light by his hand" aria-pressed="false" hidden></button>
<form id="name-form" hidden><label for="visitor-name">Oh… who are you?</label><div class="name-row"><input id="visitor-name" name="name" placeholder="Your name" autocomplete="given-name" maxlength="32" required aria-label="Your name"><button type="submit">Say hello</button></div></form>
<p id="objective" role="status" hidden><span>OBJECTIVE</span>Turn on the light</p><p id="dialogue" role="status" aria-live="polite" hidden></p><div id="error" role="alert" hidden><p>I’m having a little trouble waking up.</p><button type="button" id="retry">Try again</button></div>

<script>
(async()=>{
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,coarse=matchMedia('(pointer: coarse)').matches;
$('retry').onclick=()=>location.reload();
await spline.ready;
const names=['Robot','Robot Body Pivot','Robot Head Pivot','Robot Arm Pivot -1','Robot Arm Pivot 1','Robot Elbow Pivot 1','Head Eye Left','Head Eye Right','Robot Leg Pivot -1','Robot Leg Pivot 1','Arm 1 Finger 0','Arm 1 Finger 1','Arm 1 Finger 2'];
const parts={};for(const name of names){const o=await spline.findObjectByName(name);if(!o)throw new Error('Missing '+name);parts[name]=o;}
// Warm the model behind the opaque black overlay before the light is used.
// Revealing it then only fades the overlay, avoiding first-render work on click.
await spline.updateObject(parts['Robot'].id,{visible:true});
const sentProperties=new Map();
function update(id,props){
 let previous=sentProperties.get(id);if(!previous){previous={};sentProperties.set(id,previous);}
 function changed(source,target){
   const patch={};for(const [key,value] of Object.entries(source)){
     if(value!==null&&typeof value==='object'&&!Array.isArray(value)){
       const nested=changed(value,target[key]||(target[key]={}));
       if(Object.keys(nested).length)patch[key]=nested;
     }else if(target[key]!==value){target[key]=value;patch[key]=value;}
   }return patch;
 }
 const patch=changed(props,previous);
 return Object.keys(patch).length?spline.updateObject(id,patch):Promise.resolve();
}
let phase='boot',began=performance.now(),clock=began,visitor='',typing=0,speechTyping=false,speechUntil=0,active=true;
const write=(name,props)=>update(parts[name].id,props);
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>.5-Math.cos(Math.PI*clamp(x))/2,pulse=(u,a,b,c,d)=>ease((u-a)/(b-a))*(1-ease((u-c)/(d-c)));
function setPhase(next){phase=next;document.body.dataset.phase=next;began=performance.now();}
function wakeButton(){if(!['boot','appear'].includes(phase))return;const b=$('wake');b.hidden=false;b.disabled=false;requestAnimationFrame(()=>b.classList.add('ready'));}
function hideWake(){$('wake').classList.remove('ready');$('wake').disabled=true;$('wake').hidden=true;}
function speak(text,done){
 clearTimeout(typing);$('dialogue').hidden=false;$('dialogue').textContent='';
 const talking=text!=='...';speechTyping=talking;speechUntil=0;let n=0;
 function next(){
   n+=1;$('dialogue').textContent=text.slice(0,n);
   if(n<text.length)typing=setTimeout(next,reduced?0:34);
   else{speechTyping=false;speechUntil=talking?performance.now()+Math.max(1400,text.length*25):0;if(done)typing=setTimeout(done,1100);}
 }
 next();
}
function askName(){setPhase('name');$('name-form').hidden=false;$('visitor-name').focus({preventScroll:true});}
function search(){setPhase('search');$('objective').hidden=false;$('switch').hidden=false;$('hanging-light').hidden=false;$('spark').hidden=false;}
$('wake').onclick=()=>{if(phase==='boot'){hideWake();setPhase('appear');setTimeout(wakeButton,1500);}else if(phase==='appear'){hideWake();setPhase('waking');}};
$('name-form').onsubmit=e=>{e.preventDefault();visitor=$('visitor-name').value.trim();if(!visitor){$('visitor-name').value='';$('visitor-name').focus();return;}visitor=visitor.slice(0,32);$('name-form').hidden=true;setPhase('greeting');speak('Hello, '+visitor+'.',()=>{speak('Finally, I’ve been alone here for a while.\nIt’s kind of dark.',search);});};
function pointer(x,y){document.documentElement.style.setProperty('--mx',x+'px');document.documentElement.style.setProperty('--my',y+'px');if(phase==='search'){const r=$('hanging-light').getBoundingClientRect();$('hanging-light').style.opacity='1';$('hanging-light').style.maskImage=`radial-gradient(circle at ${x-r.left}px ${y-r.top}px,#000 16px,#0009 65px,transparent 130px)`;}}
window.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'){gazeActive=true;gazeX=e.clientX;gazeY=e.clientY;}pointer(e.clientX,e.clientY);});window.addEventListener('pointerdown',e=>pointer(e.clientX,e.clientY));
$('switch').onfocus=()=>{if(phase==='search'){const r=$('switch').getBoundingClientRect();pointer(r.left+r.width/2,r.top+r.height/2);}};
// A deliberate downward tug turns on the hanging lamp. Enter/Space retain
// the button's native accessible activation; a mouse click alone is not a tug.
let lampPull=null;
function turnOnLamp(){
 if(phase!=='search')return;
 lampPull=null;$('hanging-light').dataset.pulling='false';$('hanging-light').style.setProperty('--pull','0px');
 setPhase('lit');$('switch').setAttribute('aria-pressed','true');$('switch').setAttribute('aria-label','Hanging light is on');$('switch').disabled=true;
 $('spark').hidden=true;$('objective').hidden=true;
 speak('That’s better.',()=>{if(chapter==='intro')speak('...');});startChapter();
}
$('switch').onclick=e=>{if(!e||e.detail===0)turnOnLamp();};
$('switch').onpointerdown=e=>{
 if(phase!=='search'||e.button>0)return;
 lampPull={id:e.pointerId,y:e.clientY,distance:0,el:e.currentTarget};
 $('hanging-light').dataset.pulling='true';e.currentTarget.setPointerCapture?.(e.pointerId);
};
window.addEventListener('pointermove',e=>{
 if(!lampPull||lampPull.id!==e.pointerId)return;
 lampPull.distance=Math.max(0,Math.min(70,e.clientY-lampPull.y));
 $('hanging-light').style.setProperty('--pull',lampPull.distance+'px');
});
function releaseLamp(e,cancelled=false){
 if(!lampPull||(e.pointerId!==undefined&&e.pointerId!==lampPull.id))return;
 const pull=lampPull;lampPull=null;
 try{pull.el.releasePointerCapture?.(pull.id);}catch{}
 $('hanging-light').dataset.pulling='false';$('hanging-light').style.setProperty('--pull','0px');
 if(!cancelled&&pull.distance>=28)turnOnLamp();
}
window.addEventListener('pointerup',e=>releaseLamp(e));
window.addEventListener('pointercancel',e=>releaseLamp(e,true));
window.addEventListener('blur',()=>releaseLamp({},true));

// Per-fragment cursor light for finds. Black stays opaque: objects never turn
// into transparent ghosts, and a handle can emerge before the rest of the can.
const searchLights=new Map();
const findClay={
 'Seed Shell':['#c9a377',.84],

   for(const mesh of meshes){

     const surface=options.textured?.includes(mesh.name)&&spline.getTexture?await spline.getTexture(mesh.id):null;

async function prepareRoom(){
 homeRoom=await spline.findObjectByName('Interior Home');
 roomCamera=await spline.findObjectByName('Robot Portrait Camera');
 roomGround=await spline.findObjectByName('Studio Ground');
 const oldShell=await spline.findObjectByName('Home Room');
 if(!homeRoom||!roomCamera||!roomGround)throw new Error('Missing furnished interior');
 if(oldShell)await update(oldShell.id,{visible:false});
 await applyRoomClearances();
 // The layered contour pass leaks room edges across Milo. Give the three
 // closed head meshes opaque depth-writing surfaces instead.
 for(const [name,color] of [['Head Shell','#eee5d5'],['Head Bezel','#343d50'],['Head Screen','#7793b5']]){
   const head=await spline.findObjectByName(name);
   if(!head)continue;
   try{
     await spline.setMaterial(head.id,three=>{
       const material=new three.MeshStandardNodeMaterial();
       material.color=new three.Color(color);material.roughness=.7;material.metalness=0;
       material.transparent=false;material.opacity=1;material.depthWrite=true;material.depthTest=true;
       return material;
     });
   }catch{
     await update(head.id,{material:{alpha:100,layers:[{type:'color',alpha:100},{type:'light',alpha:100}]}});
   }
 }
 // HDR filaments give the reference's small bulbs a genuine soft bloom,
 // without increasing ambient exposure over the entire room.
 if(spline.createCustomMaterial&&spline.setMaterial){
   const glow=await spline.createCustomMaterial(three=>{
     const material=new three.MeshBasicNodeMaterial();
     material.colorNode=three.tsl.vec3(2.5,1.8,.85);material.toneMapped=false;
     return material;
   });
   const bulbs=[];
   for(let i=0;i<48;i+=2)bulbs.push(await spline.findObjectByName('Interior Golden Bulb '+i));
   bulbs.push(await spline.findObjectByName('Interior Lamp Bulb'));
   for(const bulb of bulbs)if(bulb)await spline.setMaterial(bulb.id,glow);
 }
 // Compile the furnished set underneath the opening's opaque black screen.
 // Later discovery must not pay the first-render cost of hundreds of pieces.
 await update(homeRoom.id,{visible:true});
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 await update(homeRoom.id,{visible:false});
 await update(roomCamera.id,{position:interiorCamera});
 await update(roomGround.id,{visible:true});
}
